name: Test and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run static checks
        run: npm run check

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:ui

  deploy:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: prod
      url: https://tafsir.salimov.site
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      SSH_HOST: premium78.web-hosting.com
      SSH_PORT: "21098"
      SSH_USER: saliynut
      APP_ROOT: /home/saliynut/public_html/tafsir

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.NAMECHEAP_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/namecheap_tafsir
          chmod 600 ~/.ssh/namecheap_tafsir
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Stage release
        run: |
          set -euo pipefail
          release_dir="/home/$SSH_USER/tafsir-releases/$GITHUB_SHA"
          ssh -p "$SSH_PORT" -i ~/.ssh/namecheap_tafsir \
            "$SSH_USER@$SSH_HOST" "rm -rf '$release_dir' && mkdir -p '$release_dir'"
          rsync -az -e "ssh -p $SSH_PORT -i $HOME/.ssh/namecheap_tafsir" \
            app.js package.json package-lock.json site vault deploy \
            "$SSH_USER@$SSH_HOST:$release_dir/"

      - name: Activate release
        run: |
          set -euo pipefail
          release_dir="/home/$SSH_USER/tafsir-releases/$GITHUB_SHA"
          ssh -p "$SSH_PORT" -i ~/.ssh/namecheap_tafsir \
            "$SSH_USER@$SSH_HOST" bash -s -- "$release_dir" "$APP_ROOT" <<'REMOTE'
          set -euo pipefail
          release_dir="$1"
          app_root="$2"
          export PATH="/opt/alt/alt-nodejs22/root/usr/bin:$PATH"

          cd "$release_dir"
          npm ci --omit=dev

          mkdir -p "$app_root/site" "$app_root/vault" "$app_root/node_modules" "$app_root/tmp"
          rsync -a --delete site/ "$app_root/site/"
          rsync -a --delete vault/ "$app_root/vault/"
          rsync -a --delete node_modules/ "$app_root/node_modules/"
          install -m 644 app.js package.json package-lock.json "$app_root/"
          install -m 644 deploy/namecheap.htaccess "$app_root/.htaccess"
          touch "$app_root/tmp/restart.txt"

          rm -rf "$release_dir"
          REMOTE

      - name: Verify production
        run: |
          curl --fail --silent --show-error \
            --retry 12 --retry-delay 5 --retry-all-errors \
            https://tafsir.salimov.site/healthz
